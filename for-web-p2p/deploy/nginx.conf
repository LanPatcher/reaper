# Reaper web, behind nginx.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/hytlands.com
#   sudo ln -s /etc/nginx/sites-available/hytlands.com /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d hytlands.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Run the relay with PORT=8080 and no REAPER_TLS_* — nginx terminates TLS and
# this proxies to it.

server {
    listen 80;
    listen [::]:80;
    server_name hytlands.com www.hytlands.com;

    # Everything over TLS. The page reads location.protocol to decide whether
    # to open ws:// or wss://, so a session that started on http would try to
    # open an insecure socket from a secure page and be refused by the browser.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hytlands.com www.hytlands.com;

    ssl_certificate     /etc/letsencrypt/live/hytlands.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hytlands.com/privkey.pem;

    # The app is the site.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # The relay sets its own cross-origin isolation headers and nginx must
        # not swallow them: without COOP and COEP the page is not isolated, and
        # it holds an account key in IndexedDB.
        proxy_pass_header Cross-Origin-Opener-Policy;
        proxy_pass_header Cross-Origin-Embedder-Policy;
    }

    # The relay itself. Without the upgrade headers this returns 400 and the
    # app loads, looks fine, and reaches nobody — which is the failure worth
    # naming because nothing on screen points at nginx.
    location /relay {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # A Tor circuit can be quiet for a long time between messages, and the
        # default is a minute. A proxy that closes an idle socket presents as
        # the app losing its connection every minute for no reason.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
